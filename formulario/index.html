<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>Activitat formularis - FP Llefia M8</h2>
    <div class="container">
        <div class="info">
            <div><strong>Address:</strong> 198 West 21th Street, Suite 721 New York NY 10016</div>
            <div><strong>Phone:</strong> +1235 2355 98</div>
            <div><strong>Email:</strong> info@yoursite.com</div>
            <div><strong>Website:</strong> yoursite.com</div>
        </div>
        <div class="contact-form">
            <div class="form-left">
                <h3>Contacta amb nosaltres</h3>
                <input type="text" placeholder="Name" required>
                <input type="email" placeholder="Email" required>
                <input type="text" placeholder="Subject">
                <textarea placeholder="Message"></textarea>
                <button type="submit">Enviar</button>
            </div>
            <div class="form-right"></div>
        </div>
    </div>
</body>
</html>
